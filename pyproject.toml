[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "atmospheric-pde"
version = "0.1.0"
description = "Numerical investigation of atmospheric transport and partial differential equations"
requires-python = ">=3.13"
dependencies = [
    "numpy",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest",
]